<!doctype html>
<html lang="ar" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoli Agent</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f4f5f7;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 16px;background:#1f2937;color:#fff;display:flex;justify-content:space-between;align-items:center}
  button{padding:8px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
  button.secondary{background:#6b7280}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.6}
  .user{align-self:flex-end;background:#2563eb;color:#fff}
  .agent{align-self:flex-start;background:#fff;border:1px solid #e5e7eb}
  .tool{align-self:flex-start;background:#fef9c3;font-family:monospace;font-size:12px;max-width:90%;white-space:pre-wrap}
  form{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e5e7eb}
  textarea{flex:1;padding:10px;border:1px solid #d1d5db;border-radius:6px;resize:none;height:56px;font:inherit}
</style>
</head>
<body>
<header><strong>Zoli Agent</strong><span id="status"></span><button class="secondary" onclick="reset()">محادثة جديدة</button></header>
<div id="log"></div>
<form onsubmit="send(event)">
  <textarea id="input" placeholder="اكتب طلبك... (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
  <button id="btn">إرسال</button>
</form>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const btn = document.getElementById('btn');
function add(cls, text){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
fetch('/api/status').then(r=>r.json()).then(s=>{document.getElementById('status').textContent=s.model+' @ '+s.ollama;});
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(e); } });
async function send(e){
  e.preventDefault();
  const text = input.value.trim(); if(!text) return;
  input.value=''; add('user', text); btn.disabled=true;
  const wait = add('agent', '...');
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data = await r.json();
    if(!r.ok) throw new Error(data.error);
    wait.remove();
    for(const t of data.trace){ add('tool', '🔧 '+t.tool+' '+JSON.stringify(t.args)+'\n→ '+t.result); }
    add('agent', data.reply);
  }catch(err){ wait.textContent='خطأ: '+err.message; }
  btn.disabled=false; input.focus();
}
async function reset(){ await fetch('/api/reset',{method:'POST'}); log.innerHTML=''; }
</script>
</body>
</html>
